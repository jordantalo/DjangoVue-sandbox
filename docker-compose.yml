name: transcendance

services:
  db:
    image: postgres:18.6-bookworm
    container_name: trans_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql

  frontend:
    build:
      context: .
      dockerfile: ./deploy/frontend/Dockerfile
    container_name: trans_frontend
    restart: always
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev

  backend:
    build:
      context: .
      dockerfile: ./deploy/backend/Dockerfile
    container_name: trans_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./srcs/backend:/app
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
